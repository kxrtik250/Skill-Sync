<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillSync</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="shell"><header><div><span class="eyebrow">CSE • Career intelligence</span><h1>SkillSync</h1><p>Find the career paths that fit your current skills and see exactly what to learn next.</p></div><div class="mark">SS</div></header>
<section class="layout"><form id="profile"><h2>Build your profile</h2><label>Name<input name="name" placeholder="e.g. Lyka Israth M" required></label><label>Department<input name="department" placeholder="e.g. III CSE B2" required></label><label>CGPA<input name="cgpa" type="number" min="0" max="10" step="0.01" placeholder="8.50" required></label><label>Interests <small>optional</small><input name="interests" placeholder="backend, analytics"></label><label>Technical skills</label><div id="skills" class="chips"></div><button>Generate recommendations</button><p id="error" class="error"></p></form><section id="results" class="results"><div class="empty"><div class="empty-icon">✦</div><h2>Your career map is waiting</h2><p>Complete your profile to see ranked roles, skill gaps, and a practical learning roadmap.</p></div></section></section></main><script src="/static/app.js"></script></body></html>
