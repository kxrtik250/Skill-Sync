spring.datasource.url=${SKILLSYNC_DB_URL:jdbc:sqlite:skillsync-spring.db}
spring.profiles.default=local
spring.datasource.driver-class-name=${SKILLSYNC_DB_DRIVER:org.sqlite.JDBC}
spring.jpa.database-platform=${SKILLSYNC_HIBERNATE_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true
skillsync.public-base-url=${SKILLSYNC_PUBLIC_BASE_URL:http://localhost:8080}
skillsync.password-reset.enabled=${PASSWORD_RESET_EMAIL_ENABLED:false}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
skillsync.mail.from=${SMTP_FROM:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
