spring.datasource.driver-class-name=${SKILLSYNC_DB_DRIVER:org.sqlite.JDBC}
spring.jpa.database-platform=${SKILLSYNC_HIBERNATE_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
spring.jpa.hibernate.ddl-auto=none
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.flyway.locations=classpath:db/migration/sqlite
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.thymeleaf.cache=false
