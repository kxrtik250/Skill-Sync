spring.datasource.url=${SKILLSYNC_DB_URL}
spring.datasource.username=${SKILLSYNC_DB_USERNAME}
spring.datasource.password=${SKILLSYNC_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SELECT 1
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.baseline-on-migrate=false
spring.flyway.url=${SKILLSYNC_FLYWAY_DB_URL:${SKILLSYNC_DB_URL}}
spring.flyway.user=${SKILLSYNC_FLYWAY_DB_USERNAME:${SKILLSYNC_DB_USERNAME}}
spring.flyway.password=${SKILLSYNC_FLYWAY_DB_PASSWORD:${SKILLSYNC_DB_PASSWORD}}
spring.thymeleaf.cache=true
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
skillsync.public-base-url=${SKILLSYNC_PUBLIC_BASE_URL}
skillsync.password-reset.enabled=${PASSWORD_RESET_EMAIL_ENABLED:false}
skillsync.mail.from=${SMTP_FROM:}
