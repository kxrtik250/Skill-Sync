<!doctype html><html><head><title>SkillSync | Create account</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/css/premium.css"></head><body class="auth"><div class="auth-art"><span class="brand">SKILLSYNC</span><h1>Build a career plan that keeps moving forward.</h1><p>Start with your profile. We’ll map the skills that matter next.</p><div class="orb"></div></div><main class="auth-card"><span class="eyebrow">Get started</span><h2>Create your account</h2><p class="muted">Join your personal career intelligence workspace.</p><p class="error" th:if="${error}" th:text="${error}"></p><form method="post" th:action="@{/register}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Full name<input name="fullName" maxlength="100" placeholder="Your name" autocomplete="name" required></label><label>Email<input name="email" type="email" maxlength="254" placeholder="you@example.com" autocomplete="email" required></label><label>Create password<input name="password" type="password" minlength="12" maxlength="72" autocomplete="new-password" placeholder="At least 12 characters" required></label><button>Create my workspace <span>→</span></button></form><p class="bottom">Already have an account? <a href="/login">Sign in</a></p></main></body></html>
